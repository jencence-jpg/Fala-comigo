<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fala comigo — portugais au quotidien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FD; --surface:#FFFFFF; --ink:#13213F; --muted:#5B6785;
  --cobalt:#1E4AA8; --cobalt-soft:#DCE5F8; --tram:#F2B705; --ok:#1F8A5B; --ko:#C23A2E;
  --line:#D5DDEE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1630; --surface:#17213F; --ink:#EEF2FC; --muted:#A3AECB;
    --cobalt:#8FB0F5; --cobalt-soft:#23315A; --tram:#F5C63A; --ok:#4CC08A; --ko:#F07A6E; --line:#2C3A63;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#17213F; --ink:#EEF2FC; --muted:#A3AECB;
  --cobalt:#8FB0F5; --cobalt-soft:#23315A; --tram:#F5C63A; --ok:#4CC08A; --ko:#F07A6E; --line:#2C3A63;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--tram);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:-.02em;background:none;border:0;padding:0}
.stats{display:flex;gap:14px;font-size:.95rem;color:var(--muted)}
.stats b{color:var(--ink)}
.variant{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.variant button{border:0;background:none;padding:6px 12px;font-size:.9rem;font-weight:600;color:var(--muted)}
.variant button[aria-pressed="true"]{background:var(--cobalt);color:var(--bg)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 22px;width:100%;
  background:none;border:0;padding:0;text-align:center}
.week .day{display:flex;flex-direction:column;align-items:center;gap:5px}
.week svg{width:100%;height:auto;display:block;border-radius:6px}
.week .t-bg{fill:var(--surface);stroke:var(--line);stroke-width:2}
.week .t-mo{fill:none;stroke:var(--line);stroke-width:3}
.week .t-dot{fill:var(--line)}
.week .on .t-bg{fill:var(--cobalt);stroke:var(--cobalt)}
.week .on .t-mo{stroke:var(--bg)}
.week .on .t-dot{fill:var(--bg)}
.week .goal .t-bg{stroke:var(--tram);stroke-width:6}
.week .goal .t-dot{fill:var(--tram)}
.week .future svg{opacity:.45}
.week .future .t-bg{stroke-dasharray:6 5}
.week .lbl{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:capitalize}
.week .is-today .lbl{color:var(--ink);font-weight:800}
.week .is-today .lbl::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--tram);margin:2px auto 0}
h1{font-size:2rem;line-height:1.1;letter-spacing:-.03em;margin:0 0 6px;font-weight:800}
.lead{color:var(--muted);margin:0 0 22px}
.modes{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:16px;padding:16px}
.mode:hover{border-color:var(--cobalt)}
.mode .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  background:var(--cobalt-soft);font-size:1.5rem}
.mode strong{display:block;font-size:1.1rem}
.mode small{color:var(--muted);font-size:.9rem}
.due{margin-left:auto;background:var(--tram);color:#13213F;font-weight:800;border-radius:999px;padding:2px 10px;font-size:.85rem}
.tip{margin-top:22px;font-size:.9rem;color:var(--muted);border-left:3px solid var(--tram);padding-left:12px}
/* exercise */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.back{border:0;background:none;font-size:1.4rem;padding:4px 8px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tram);width:0;transition:width .3s}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:26px 20px;min-height:220px;
  display:flex;flex-direction:column;justify-content:center;gap:12px}
.prompt{color:var(--muted);font-size:.95rem;margin:0}
.big{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0}
.pt{color:var(--cobalt)}
.note{font-size:.92rem;color:var(--muted);background:var(--cobalt-soft);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:100px;border:0;border-radius:14px;padding:14px 12px;font-weight:700;background:var(--cobalt);color:var(--bg)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ko{background:var(--ko)} .btn.ok{background:var(--ok)}
.audio{display:flex;gap:8px}
.audio button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-weight:600}
.choice.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.choice.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 14%,var(--surface))}
.slot{min-height:58px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.slot .tile{background:var(--cobalt-soft);border-color:transparent}
.feedback{font-weight:700;margin:0}
.feedback.ok{color:var(--ok)} .feedback.ko{color:var(--ko)}
.end{text-align:center}
.end .big{font-size:2.4rem}
.hidden{display:none!important}
.warn{font-size:.88rem;color:var(--ko);margin-top:10px}
.hdr-right{display:flex;align-items:center;gap:8px}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:34px;font-size:1rem}
.today{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;text-align:left;width:100%;display:block}
.today .lbl{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);margin-bottom:8px}
.today .lbl b{color:var(--ink)}
.pbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--tram);border-radius:99px}
.pbar.done i{background:var(--ok)}
h2{font-size:1.15rem;margin:26px 0 10px;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:1.5rem;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:.82rem}
.goal{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--muted);margin-top:12px}
.goal button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600}
.goal button[aria-pressed="true"]{background:var(--cobalt);color:var(--bg);border-color:var(--cobalt)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(18px,1fr);gap:4px;min-width:300px}
.heat span{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat span.l1{background:color-mix(in srgb,var(--cobalt) 35%,var(--line))}
.heat span.l2{background:color-mix(in srgb,var(--cobalt) 70%,var(--line))}
.heat span.l3{background:var(--cobalt);box-shadow:inset 0 0 0 2px var(--tram)}
.heat span.fut{background:transparent}
.heat span.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.days{display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.dayrow .d{font-weight:700;text-transform:capitalize}
.dayrow .n{font-weight:700;text-align:right}
.dayrow small{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.dayrow.empty{opacity:.55}
.path{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.path h3{margin:0 0 10px;font-size:1rem;display:flex;justify-content:space-between;align-items:baseline}
.path h3 small{color:var(--muted);font-weight:600;font-size:.85rem}
.lvl{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lvl:first-of-type{border-top:0}
.lvl .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--line);color:var(--muted)}
.lvl.open .num{background:var(--cobalt);color:var(--bg)}
.lvl.cur .num{box-shadow:0 0 0 3px var(--tram)}
.lvl .nm{font-weight:700}
.lvl .ds{grid-column:2/-1;color:var(--muted);font-size:.85rem}
.lvl .pc{font-size:.85rem;color:var(--muted);font-weight:600}
.lvl.locked{opacity:.6}
.lvl .mini{grid-column:2/-1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.lvl .mini{position:relative}
.lvl .mini i{position:absolute;left:0;top:0;height:100%;border-radius:99px}
.lvl .mini i.seen{background:color-mix(in srgb,var(--cobalt) 35%,var(--line))}
.lvl .mini i.acq{background:var(--tram)}
button.lvl{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.lvl:hover .nm{color:var(--cobalt)}
.path .help{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.levelup{background:var(--tram);color:#13213F;border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:14px}
.sync{font-size:.88rem;color:var(--muted);margin:0 0 14px}
.backup{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.backup p{margin:0 0 10px;font-size:.9rem;color:var(--muted)}
.backup textarea{width:100%;min-height:70px;font:13px/1.3 ui-monospace,monospace;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical}
.backup .msg{font-weight:700;font-size:.9rem;margin-top:8px}
.story-item{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;width:100%}
.story-item:hover:not(:disabled){border-color:var(--cobalt)}
.story-item .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--cobalt-soft);font-size:1.5rem}
.story-item .st-txt{flex:1}
.story-item strong{display:block;font-size:1.05rem}
.story-item small{color:var(--muted);font-size:.88rem}
.story-item .st-right{font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.story-item .st-right .due{margin:0}
.story-item.locked{opacity:.55;cursor:default}
.st-title{margin:0 0 16px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.bub-row{display:flex;align-items:flex-end;gap:8px;max-width:88%}
.bub-row.me{align-self:flex-end;flex-direction:row-reverse}
.av{font-size:1.6rem;line-height:1;flex:none}
.bub{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-weight:600}
.bub.me{background:var(--cobalt);color:var(--bg);border-color:var(--cobalt);border-radius:18px 18px 6px 18px}
.bub .who{font-size:.78rem;color:var(--muted);font-weight:700}
.bub .bpt{font-size:1.05rem}
.bub .tr{font-size:.88rem;font-weight:400;color:var(--muted);margin-top:4px}
.bub.me .tr{color:color-mix(in srgb,var(--bg) 80%,var(--cobalt))}
.chat .note{margin:0 0 4px 38px}
.st-act{margin-top:14px;padding-bottom:20px}
.st-q{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.st-q .choices{margin-top:12px}
.st-q .feedback{margin-top:12px}
.fill-line{font-size:1.15rem;font-weight:700;margin:10px 0 0}
.fill-line .who{display:block;font-size:.78rem;color:var(--muted)}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--tram);color:transparent}
.hud{display:flex;gap:10px;align-items:stretch;margin-bottom:16px}
.hud-streak{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:8px 14px;font-size:1.2rem}
.hud-streak b{font-size:1.3rem;line-height:1}
.hud-streak small{font-size:.75rem;color:var(--muted)}
.hud-rank{flex:1;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.hud-rank .rk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-rank .rk-xp{font-weight:800;color:var(--cobalt)}
.hud-rank small{color:var(--muted);font-size:.8rem}
.review-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--tram);color:#13213F;border:0;border-radius:16px;padding:14px 16px;margin-bottom:18px}
.review-cta .ic{font-size:1.5rem}
.review-cta .rv-txt{flex:1}
.review-cta strong{display:block;font-size:1.05rem}
.review-cta small{font-size:.86rem;opacity:.85}
.review-cta .due{background:#13213F;color:var(--tram)}
.review-ok{font-size:.9rem;color:var(--ok);font-weight:700;margin:0 0 18px}
.saga{display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
.ch-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cobalt);color:var(--bg);border:0;border-radius:18px;padding:14px 16px}
.ch-head .ch-em{font-size:1.8rem;flex:none}
.ch-head .ch-txt{flex:1;display:flex;flex-direction:column}
.ch-head small{font-size:.8rem;opacity:.8}
.ch-head strong{font-size:1.2rem;letter-spacing:-.01em}
.ch-head .ch-txt span{font-size:.86rem;opacity:.85}
.ch-head .ch-count{font-weight:800;font-size:.95rem;background:color-mix(in srgb,var(--bg) 20%,transparent);border-radius:999px;padding:3px 10px}
.ch-head.complete{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.ch-head.complete .ch-count{background:var(--ok);color:#fff}
.ch-head.locked{background:var(--surface);color:var(--muted);border:1.5px dashed var(--line);cursor:default}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 6px}
.node-row{display:flex;flex-direction:column;align-items:center;width:100%}
.node{position:relative;width:72px;height:72px;padding:0;border:0;background:none;transform:translateX(var(--x));transition:transform .15s}
.node svg{width:100%;height:100%;display:block}
.node .t-bg{fill:var(--line);stroke:none}
.node .t-mo{fill:none;stroke:color-mix(in srgb,var(--muted) 35%,transparent);stroke-width:3}
.node .n-ic{position:absolute;inset:0;display:grid;place-items:center;font-size:1.55rem;font-weight:800;color:var(--muted)}
.node.done .t-bg{fill:var(--cobalt)}
.node.done .t-mo{stroke:color-mix(in srgb,var(--bg) 35%,transparent)}
.node.done .n-ic{color:var(--bg)}
.node .n-ok{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:.8rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.node.current .t-bg{fill:var(--tram)}
.node.current .t-mo{stroke:color-mix(in srgb,#13213F 30%,transparent)}
.node.current .n-ic{color:#13213F}
.node.current::before{content:"";position:absolute;inset:-8px;border-radius:18px;border:3px solid var(--tram);opacity:.55;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.12);opacity:0}}
.node.story .n-ic,.node.chest .n-ic{font-size:1.7rem}
.node.locked{cursor:default}
.node.locked .n-ic{font-size:1.1rem;opacity:.7}
.pop{position:relative;margin-top:14px;width:min(100%,340px);background:var(--surface);border:1.5px solid var(--tram);border-radius:16px;padding:14px 16px;text-align:left}
.pop::before{content:"";position:absolute;top:-9px;left:50%;width:16px;height:16px;background:var(--surface);border-left:1.5px solid var(--tram);border-top:1.5px solid var(--tram);transform:translateX(-50%) rotate(45deg)}
.pop strong{display:block;font-size:1.05rem}
.pop p{margin:4px 0 12px;color:var(--muted);font-size:.9rem}
.pop .btn{width:100%}
.sess-xp{font-weight:800;color:var(--cobalt);font-size:.95rem;white-space:nowrap}
.xp-big{font-size:2rem;font-weight:800;color:var(--tram);margin:0;letter-spacing:-.02em}
.fin-rank{display:flex;flex-direction:column;gap:6px;margin-top:10px;text-align:left}
.fin-rank span:first-child{font-weight:700}
.fin-rank small{color:var(--muted);font-size:.85rem}
.chest-stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0 10px}
.chest-btn{font-size:5.5rem;line-height:1;border:0;background:none;padding:10px;transition:transform .2s}
.chest-btn.opening{animation:shake .6s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(12deg) scale(1.1)}60%{transform:rotate(-8deg) scale(1.15)}80%{transform:rotate(6deg) scale(1.2)}}
.cad-card{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--cobalt);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.cad-card small{color:var(--muted);font-size:.8rem;font-weight:700}
.cad-card .big{font-size:1.4rem}
.cad-card.locked{border-left-color:var(--line);opacity:.65}
.cad-pt{font-size:1.15rem;font-weight:800;color:var(--cobalt);margin:0;display:flex;gap:8px;align-items:center}
.cad-fr{margin:0;font-weight:600}
.cad-note{margin:0;color:var(--muted);font-size:.9rem}
.cad-list{display:grid;gap:12px}
.say{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 8px;font-size:.9rem}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:999px;transition:opacity .2s,transform .2s;z-index:10;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.next-card{background:var(--surface);border:2px solid var(--cobalt);border-radius:20px;padding:16px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.next-card .nc-top{display:flex;gap:12px;align-items:flex-start}
.next-card .nc-em{font-size:2rem;line-height:1;flex:none;width:52px;height:52px;border-radius:14px;background:var(--cobalt-soft);display:grid;place-items:center}
.next-card .nc-txt{display:flex;flex-direction:column;gap:2px}

let pushChain=Promise.resolve(), pushWaiting=false;
function pushRemote(){
  if(!remote || pushWaiting) return;

// Fusionne deux progressions sans rien perdre (le meilleur des deux côtés)
function mergeState(a,b){
  if(!b) return a;
  // Copie profonde : les données lues sur le compte sont en lecture seule (figées).
  // Sans cette copie, les cartes venues du compte ne pouvaient plus être modifiées.
  a=JSON.parse(JSON.stringify(a)); b=JSON.parse(JSON.stringify(b));
  const out=Object.assign({},a);
  out.xp=Math.max(a.xp||0,b.xp||0);
  out.goal=(b.updatedAt||0)>(a.updatedAt||0)?(b.goal||a.goal):(a.goal||b.goal);
  out.unlocked=Math.max(a.unlocked||1,b.unlocked||1);
  out.seenLevel=Math.max(a.seenLevel||1,b.seenLevel||1);
  out.cards=Object.assign({},a.cards||{});
  for(const [k,c] of Object.entries(b.cards||{})){
    const m=out.cards[k];
    if(!m || (c.box||0)>(m.box||0) || ((c.box||0)===(m.box||0) && (c.due||0)>(m.due||0))) out.cards[k]=c;
  }
  out.days=Object.assign({},a.days||{});
  for(const [k,d] of Object.entries(b.days||{})){
    const m=out.days[k]; if(!m || (d.n||0)>(m.n||0)) out.days[k]=d;
  }
  if((b.newDay||0)>(a.newDay||0)){ out.newDay=b.newDay; out.newCount=b.newCount; out.extraNew=b.extraNew; }
  else if(b.newDay===a.newDay){ out.newCount=Math.max(a.newCount||0,b.newCount||0); out.extraNew=Math.max(a.extraNew||0,b.extraNew||0); }
  out.path=Object.assign({},a.path||{},b.path||{});
  out.goalXp=(b.updatedAt||0)>(a.updatedAt||0)?(b.goalXp||a.goalXp):(a.goalXp||b.goalXp);
  if(a.rankSeen!==undefined||b.rankSeen!==undefined) out.rankSeen=Math.max(a.rankSeen??-1,b.rankSeen??-1);
  out.stories=Object.assign({},a.stories||{});
  for(const [k,v] of Object.entries(b.stories||{})){ const m=out.stories[k]; if(!m||(v.best||0)>(m.best||0)) out.stories[k]=v; }
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return out;
}

  if(SYNC.local) return {ic:"📱",t:"Progression sauvegardée sur cet appareil uniquement"};

}

async function initRemote(){
  if(!(window.claude && window.claude.use)) return;
  try{
    const [db,user] = await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    SYNC.cloud="pending"; refreshSyncBadge();
    const ref = db.doc("data/users/"+uid+"/progress");
    const snap = await ref.get();
    const r = snap.exists ? snap.data() : null;
    remote = ref;
    S = mergeState(S, r);
    try{localStorage.setItem("fala-comigo",JSON.stringify(S));}catch(e){}
    pushRemote();
    if(!session) render();
  }catch(e){ remote=null; SYNC.cloud="error"; refreshSyncBadge(); }
}

function touchStreak(){
  const t=today();
  if(S.lastDay===t) return;
  S.streak = (S.lastDay===t-DAY) ? S.streak+1 : 1;

}

/* ---------- Audio (synthèse vocale du navigateur) ---------- */
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices(); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function voiceFor(){
  const tag = "pt-pt";
  const norm = v => v.lang.toLowerCase().replace("_","-");
  return voices.find(v=>norm(v)===tag) || voices.find(v=>norm(v).startsWith("pt"));
}
function hasVoice(){ return "speechSynthesis" in window && !!voiceFor(); }
function speak(text,slow,pitch){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace("…","quê"));
  const v=voiceFor(); if(v) u.voice=v;
  u.lang = "pt-PT";
  u.rate = slow ? .65 : .95;
  if(pitch) u.pitch = pitch;
  speechSynthesis.speak(u);
}

const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = s => s.toLowerCase().replace(/[!?.,¿¡]/g,"").replace(/\s+/g," ").trim();

function rankOf(xp){ let r=0; RANKS.forEach((k,i)=>{ if(xp>=k.xp) r=i; }); return r; }

let NODES = null;
function allNodes(){
  if(NODES) return NODES;
  NODES=[];
  SAGA.forEach(ch=>{
    const [pre,a,b]=ch.src, ids=[];
    for(let i=a;i<b;i++) ids.push(pre==="c"?"c"+i:pre+"_"+i);
    const items=ids.map(id=>ITEMS.find(it=>it.id===id)).filter(Boolean);
    const nL=Math.max(1,Math.round(items.length/8)), lessons=[];
    for(let k=0;k<nL;k++) lessons.push(items.slice(Math.round(k*items.length/nL),Math.round((k+1)*items.length/nL)));
    ch.items=items; ch.nodes=[];
    let r=0;
    lessons.forEach((its,k)=>{
      ch.nodes.push({id:`ch${ch.n}-l${k+1}`,type:"lesson",ch,k:k+1,of:nL,items:its});
      const bs=STORIES.filter(st=>st.bonus&&st.ch===ch.n);
      if(bs[k]) ch.nodes.push({id:`ch${ch.n}-b${k+1}`,type:"story",bonus:true,ch,story:bs[k].id});
      if((k+1)%2===0 && k+1<nL) ch.nodes.push({id:`ch${ch.n}-r${++r}`,type:"practice",ch,upto:k+1});
    });
    ch.nodes.push({id:`ch${ch.n}-r${++r}`,type:"practice",ch,upto:nL,final:true});
    ch.nodes.push({id:`ch${ch.n}-story`,type:"story",ch,story:ch.story});
    ch.nodes.push({id:`ch${ch.n}-chest`,type:"chest",ch});
    ch.nodes.forEach(nd=>NODES.push(nd));
  });
  return NODES;
}
const isDone = id => !!(S.path && S.path[id]);
function markDone(id){
  if(!S.path || Object.isFrozen(S.path)) S.path=Object.assign({},S.path||{});
  S.path[id]=true;
}
function currentNode(){ return allNodes().find(nd=>!nd.bonus && !isDone(nd.id)) || null; }
const coreNodes = ch => ch.nodes.filter(nd=>!nd.bonus);
function nodeState(nd){
  if(isDone(nd.id)) return "done";
  if(nd.bonus){ // facultative : ouverte dès que l'étape d'avant est faite, ne bloque jamais le chemin
    const i=nd.ch.nodes.indexOf(nd), prev=nd.ch.nodes.slice(0,i).reverse().find(x=>!x.bonus);
    return prev && isDone(prev.id) ? "open" : "locked";
  }
  const c=currentNode(); return c && c.id===nd.id ? "current" : "locked";
}
// Convertit la progression existante : leçons déjà vues, histoires lues, révisions dépassées
function migratePath(){
  const nodes=allNodes(); let changed=false;
  nodes.forEach(nd=>{
    if(isDone(nd.id)) return;
    if(nd.type==="lesson" && nd.items.every(it=>S.cards[it.id])){ markDone(nd.id); changed=true; }
    if(nd.type==="story" && (S.stories||{})[nd.story]){ markDone(nd.id); changed=true; }
  });
  let laterDone=false;
  for(let i=nodes.length-1;i>=0;i--){
    const nd=nodes[i];
    if(!nd.bonus && (nd.type==="lesson"||nd.type==="story") && isDone(nd.id)) laterDone=true;
    if(nd.type==="practice" && laterDone && !isDone(nd.id)){ markDone(nd.id); changed=true; }
  }
  if(changed) save();
}
// Phrases disponibles : celles des leçons faites + la leçon en cours
function openItems(){
  const c=currentNode(), out=[];
  allNodes().forEach(nd=>{ if(nd.type==="lesson" && (isDone(nd.id) || (c&&c.id===nd.id))) out.push(...nd.items); });
  return out.length ? out : ITEMS.slice(0,8);
}

const OFFS=[0,52,78,52,0,-52,-78,-52];
const NODE_ICON={lesson:"★",practice:"↻",story:"📖",chest:"🎁"};
function nodeLabel(nd){
  if(nd.type==="lesson") return `Leçon ${nd.k} sur ${nd.of}`;
  if(nd.type==="practice") return nd.final?"Révision du chapitre":"Révision";
  if(nd.type==="story") return (nd.bonus?"Histoire bonus : ":"Histoire : ")+(STORIES.find(s=>s.id===nd.story)||{}).title;
  return "Coffre du chapitre";
}
function nodeDesc(nd){
  if(nd.type==="lesson") return `${nd.items.length} phrases, dont « ${esc(nd.items[0].pt)} »`;
  if(nd.type==="practice") return "Oreille, puzzle et cartes sur les phrases du chapitre";
  if(nd.type==="story") return esc((STORIES.find(s=>s.id===nd.story)||{}).fr||"");
  return "Une expression de la avó pour ton carnet";
}
function nodeXp(nd){
  if(nd.type==="lesson") return nd.items.length*XP.lesson+XP.nodeBonus;
  if(nd.type==="practice") return 10*XP.practice+XP.nodeBonus;
  if(nd.type==="story") return 50;
  return XP.chest;
}
function tileSVG(){
  return `<svg viewBox="0 0 60 60" aria-hidden="true"><rect class="t-bg" x="2" y="2" width="56" height="56" rx="10"/>
    <path class="t-mo" d="M30 6 Q43 30 30 54 Q17 30 30 6 Z M6 30 Q30 17 54 30 Q30 43 6 30 Z"/></svg>`;
}
function sagaHTML(){
  const cur=currentNode(), curCh=cur?cur.ch.n:SAGA.length+1;
  allNodes();
  return SAGA.map(ch=>{
    const core=coreNodes(ch), doneN=core.filter(nd=>isDone(nd.id)).length, all=core.length;
    const bonusTotal=ch.nodes.length-all, bonusDone=ch.nodes.filter(nd=>nd.bonus&&isDone(nd.id)).length;
    const complete=doneN===all, locked=ch.n>curCh;
    const head=`<button class="ch-head ${locked?"locked":""} ${complete?"complete":""}" data-ch="${ch.n}" ${locked?"disabled":""}>
      <span class="ch-em">${ch.emoji}</span>
      <span class="ch-txt"><small>Chapitre ${ch.n}</small><strong>${esc(ch.title)}</strong><span>${locked?`🔒 Termine le chapitre ${ch.n-1} pour l'ouvrir`:esc(ch.fr)}</span></span>
      <span class="ch-count">${complete?"✓":`${doneN}/${all}`}${!locked&&bonusTotal?`<small class="ch-bonus">📖 ${bonusDone}/${bonusTotal}</small>`:""}</span></button>`;
    const show = !locked && (!complete || expanded[ch.n]);
    if(!show) return `<section class="chapter">${head}</section>`;
    const nodes=ch.nodes.map((nd,i)=>{
      const stt=nodeState(nd), off=OFFS[i%OFFS.length];
      const pop = openPop===nd.id && stt!=="locked" ? popHTML(nd,stt) : "";
      return `<div class="node-row">
        <button class="node ${nd.type} ${nd.bonus?"bonus":""} ${stt}" data-node="${nd.id}" style="--x:${off}px" aria-label="${esc(nodeLabel(nd))}, ${stt==="done"?"terminé":stt==="current"?"à faire maintenant":stt==="open"?"disponible, facultatif":"verrouillé"}">
          ${tileSVG()}<span class="n-ic">${stt==="locked"?"🔒":NODE_ICON[nd.type]}</span>
          ${stt==="done"?`<span class="n-ok">✓</span>`:""}</button>${pop}</div>`;
    }).join("");
    return `<section class="chapter">${head}<div class="nodes">${nodes}</div></section>`;
  }).join("");
}
function popHTML(nd,stt){
  const replay = stt==="done";
  let btn;
  if(nd.type==="chest") btn = replay ? `<button class="btn" data-run="${nd.id}">Relire l'expression</button>` : `<button class="btn" data-run="${nd.id}">Ouvrir le coffre +${XP.chest} XP</button>`;
  else btn = `<button class="btn" data-run="${nd.id}">${replay?"Refaire (sans bonus)":`Commencer · jusqu'à +${nodeXp(nd)} XP`}</button>`;
  return `<div class="pop"><strong>${esc(nodeLabel(nd))}</strong><p>${nodeDesc(nd)}</p>${btn}</div>`;
}
function bindSaga(){
  $app.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{
    const nd=allNodes().find(x=>x.id===b.dataset.node);
    if(nodeState(nd)==="locked"){ toast(nd.bonus?"🔒 Histoire bonus : termine d'abord la leçon juste avant":"🔒 Termine d'abord les étapes précédentes"); return; }
    popAuto=false; openPop = openPop===nd.id ? "" : nd.id;
    document.getElementById("saga").innerHTML=sagaHTML(); bindSaga();
  });
  $app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.ch, ch=SAGA[n-1];
    if(coreNodes(ch).every(nd=>isDone(nd.id))){ expanded[n]=!expanded[n]; document.getElementById("saga").innerHTML=sagaHTML(); bindSaga(); }
  });
  $app.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>runNode(b.dataset.run));
}
function runNode(id){
  const nd=allNodes().find(x=>x.id===id);
  popAuto=true; scrollToCurrent=true;
  if(nd.type==="lesson") return startLesson(nd);
  if(nd.type==="practice") return startPractice(nd);
  if(nd.type==="story") return playStory(nd.story,nd);
  return openChest(nd);
}

let toastTimer=null;

  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
function weekTiles(){
  const g=goalXp(); let html="", done=0;
  const now=new Date(); now.setHours(12,0,0,0);
  const monday=now.getTime()-((now.getDay()+6)%7)*DAY;
  const names=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  for(let j=0;j<7;j++){
    const t=monday+j*DAY, isToday=dkey(t)===dkey(), isFuture=t>now.getTime();
    const d=(S.days||{})[dkey(t)], n=d?d.n:0, x=d?d.xp||0:0;
    if(n) done++;
    const cls=(n?"on ":"")+(x>=g?"goal ":"")+(isToday?"is-today ":"")+(isFuture?"future":"");
    const name=new Date(t).toLocaleDateString("fr-FR",{weekday:"long"});
    const state= isFuture?"à venir":x>=g?"objectif atteint, "+x+" XP":n?x+" XP":"pas de pratique";
    html+=`<span class="day ${cls}" title="${name} : ${state}">
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <rect class="t-bg" x="1" y="1" width="58" height="58" rx="6"/>
        <path class="t-mo" d="M30 8 Q42 30 30 52 Q18 30 30 8 Z M8 30 Q30 18 52 30 Q30 42 8 30 Z"/>
        <circle class="t-dot" cx="30" cy="30" r="5"/>
      </svg>
      <span class="lbl">${names[j]}</span></span>`;
  }
  return `<button class="week" id="week-tiles" aria-label="Ta semaine : ${done} jour${done>1?"s":""} de pratique sur 7. Voir le suivi">${html}</button>`;
}
function todayCard(){
  const d=S.days&&S.days[dkey()]||{xp:0}, x=d.xp||0, g=goalXp(), pc=Math.min(100,Math.round(x/g*100));
  const msg = x>=g ? "Objectif du jour atteint ✅" : x ? `Encore ${g-x} XP pour l'objectif du jour` : "Objectif du jour";
  return `<button class="today" id="today-card" aria-label="Voir le suivi par jour">
    <span class="lbl"><span>${msg}</span><b>${x} / ${g} XP</b></span>
    <span class="pbar ${x>=g?"done":""}"><i style="width:${pc}%"></i></span></button>`;
}

/* ---------- Suivi par jour ---------- */
function bestStreak(){
  const keys=Object.keys(S.days||{}).filter(k=>S.days[k].n>0).sort();
  let best=0,cur=0,prev=null;
  for(const k of keys){
    const t=new Date(k+"T12:00:00").getTime();
    cur = (prev!==null && Math.round((t-prev)/DAY)===1) ? cur+1 : 1;
    best=Math.max(best,cur); prev=t;
  }
  return best;
}
function currentStreak(){
  // compte les jours consécutifs actifs jusqu'à aujourd'hui (ou hier si rien aujourd'hui encore)
  let t=Date.now(), n=0;
  if(!(S.days[dkey(t)]&&S.days[dkey(t)].n)) t-=DAY;
  while(S.days[dkey(t)]&&S.days[dkey(t)].n){ n++; t-=DAY; }
  return n;
}
function renderStats(){
  session=null;
  if(!S.days) S.days={};
  const g=goalXp(), now=Date.now();
  const td=S.days[dkey()]||{n:0,good:0,nw:0,sec:0};
  const all=Object.values(S.days);
  const totalN=all.reduce((a,d)=>a+d.n,0), totalSec=all.reduce((a,d)=>a+d.sec,0);
  const mastered=Object.values(S.cards).filter(c=>c.box>=3).length;
  const active=all.filter(d=>d.n>0).length;

  // Calendrier : 12 semaines, du lundi au dimanche
  const t0=new Date(); t0.setHours(12,0,0,0);
  const dow=(t0.getDay()+6)%7; // 0 = lundi
  const start=t0.getTime()-(dow+7*11)*DAY;
  let cells="";
  for(let i=0;i<84;i++){
    const t=start+i*DAY, k=dkey(t), d=S.days[k];
    if(t>now){ cells+=`<span class="fut"></span>`; continue; }
    const n=d?d.xp||0:0, lvl = n===0?"":n>=g?"l3":n>=g/2?"l2":"l1";
    const label=new Date(t).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+" : "+n+" XP";
    cells+=`<span class="${lvl} ${k===dkey()?"now":""}" title="${label}" aria-label="${label}"></span>`;
  }

  // Graphique : 14 derniers jours
  const W=340,H=150,pb=22,pt=10, bars=[];
  for(let i=13;i>=0;i--){ const t=now-i*DAY; bars.push({t,n:(S.days[dkey(t)]||{xp:0}).xp||0}); }
  const max=Math.max(g,...bars.map(b=>b.n))*1.1, bw=W/14;
  const y=v=>pt+(H-pb-pt)*(1-v/max);
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP gagnés sur les 14 derniers jours">
    ${bars.map((b,i)=>`<rect x="${i*bw+4}" y="${y(b.n)}" width="${bw-8}" height="${H-pb-y(b.n)}" rx="3" fill="${b.n>=g?"var(--cobalt)":"color-mix(in srgb,var(--cobalt) 45%,var(--line))"}"/>
      ${b.n?`<text x="${i*bw+bw/2}" y="${y(b.n)-3}" text-anchor="middle" font-size="9" fill="var(--muted)">${b.n}</text>`:""}
      <text x="${i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${new Date(b.t).toLocaleDateString("fr-FR",{weekday:"narrow"})}</text>`).join("")}
    <line x1="0" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--tram)" stroke-width="2" stroke-dasharray="5 4"/>
  </svg>`;

  // Journal des 7 derniers jours
  let rows="";
  for(let i=0;i<7;i++){
    const t=now-i*DAY, d=S.days[dkey(t)];
    const name = i===0?"Aujourd'hui":i===1?"Hier":new Date(t).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"});
    if(!d||!d.n){ rows+=`<div class="dayrow empty"><span class="d">${name}</span><span class="n">—</span><small>Pas de pratique</small></div>`; continue; }
    rows+=`<div class="dayrow"><span class="d">${name}${(d.xp||0)>=g?" ✅":""}</span><span class="n">${d.xp||0} XP</span>
      <small>${d.n} exercices · ${Math.round(d.good/d.n*100)} % de réussite · ${d.nw} nouvelle${d.nw>1?"s":""} phrase${d.nw>1?"s":""} · ${Math.max(1,Math.round(d.sec/60))} min</small></div>`;
  }

  $app.innerHTML = `<div class="top"><button class="back" id="back" aria-label="Retour">←</button><strong>Ton suivi</strong></div>
    ${todayCard()}
    <div class="goal">Objectif quotidien :
      ${[50,100,200].map(v=>`<button data-goal="${v}" aria-pressed="${v===g}">${v} XP</button>`).join("")}</div>

    <h2>En chiffres</h2>
    <div class="kpis">
      <div class="kpi"><b>${currentStreak()}</b><small>jours d'affilée</small></div>
      <div class="kpi"><b>${bestStreak()}</b><small>meilleure série</small></div>
      <div class="kpi"><b>${active}</b><small>jours pratiqués</small></div>
      <div class="kpi"><b>${totalN}</b><small>exercices au total</small></div>
      <div class="kpi"><b>${mastered}</b><small>phrases bien ancrées</small></div>
      <div class="kpi"><b>${Math.round(totalSec/60)}</b><small>minutes au total</small></div>
    </div>

    <h2>Les 14 derniers jours</h2>
    <div class="chart">${svg}</div>
    <p class="legend">Barre pleine = objectif atteint · ligne jaune = ton objectif</p>

    <h2>Tes 12 dernières semaines</h2>
    <div class="heat-wrap"><div class="heat">${cells}</div></div>
    <div class="legend">Moins <span style="background:var(--line)"></span><span style="background:color-mix(in srgb,var(--cobalt) 35%,var(--line))"></span><span style="background:color-mix(in srgb,var(--cobalt) 70%,var(--line))"></span><span style="background:var(--cobalt);box-shadow:inset 0 0 0 2px var(--tram)"></span> Objectif</div>

    <h2>Journal de la semaine</h2>
    <div class="days">${rows}</div>
    <h2>Sauvegarde</h2>
    <p class="sync" id="sync-badge"></p>
    <div class="backup">
      <p>Pour changer d'appareil ou ne rien perdre : copie ton code de sauvegarde et colle-le sur l'autre appareil. Les deux progressions sont fusionnées, rien n'est écrasé.</p>
      <div class="row" style="margin-top:0"><button class="btn alt" id="bk-copy">Copier mon code</button><button class="btn alt" id="bk-show">Coller un code</button></div>
      <div id="bk-zone" class="hidden" style="margin-top:10px">
        <textarea id="bk-text" placeholder="Colle ton code ici" aria-label="Code de sauvegarde"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="bk-import">Importer</button></div>
      </div>
      <p class="msg" id="bk-msg"></p>
    </div>
    <p class="tip">Une « phrase bien ancrée » est une phrase que tu as réussie plusieurs fois d'affilée, espacées de plusieurs jours. Le temps est estimé à partir de tes réponses (plafonné à 90 s par exercice).</p>`;
  document.getElementById("back").onclick=render;
  $app.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{ S.goalXp=+b.dataset.goal; save(); renderStats(); });
  refreshSyncBadge();
  const msg=t=>{ document.getElementById("bk-msg").textContent=t; };
  document.getElementById("bk-copy").onclick=async()=>{
    const code="FALA1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{ await navigator.clipboard.writeText(code); msg("Code copié ✅ Garde-le dans tes notes ou envoie-le toi."); }
    catch(e){ document.getElementById("bk-zone").classList.remove("hidden"); const ta=document.getElementById("bk-text"); ta.value=code; ta.select(); msg("Copie automatique impossible : sélectionne le texte ci-dessus et copie-le."); }
  };
  document.getElementById("bk-show").onclick=()=>{ document.getElementById("bk-zone").classList.remove("hidden"); document.getElementById("bk-text").value=""; document.getElementById("bk-text").focus(); };
  document.getElementById("bk-import").onclick=()=>{
    try{
      const raw=document.getElementById("bk-text").value.trim().replace(/^FALA1:/,"");
      const data=JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!data||typeof data!=="object"||!data.cards) throw 0;
      S=mergeState(S,data); save(); renderStats(); document.getElementById("bk-msg").textContent="Progression importée et fusionnée ✅";
    }catch(e){ msg("Ce code n'est pas valide. Vérifie qu'il est copié en entier."); }
  };
  window.scrollTo(0,0);
}

/* ---------- Sessions ---------- */
let session=null;
const ex = (it,kind) => ({it,kind});
const puzzleOk = it => !it.pt.includes("…") && txt(it).split(" ").length>=3;
function start(mode){
  let queue, opts={};
  if(mode==="review"){
    queue=shuffle(dueCards()).slice(0,20).map(it=>ex(it,"cards"));
    if(!queue.length){ renderAllDone(); return; }
    opts={xpPer:XP.review, xpMiss:XP.reviewMiss, label:"Révisions du jour"};
  } else if(mode==="free"){
    queue=shuffle(ITEMS.filter(it=>S.cards[it.id])).slice(0,10).map(it=>ex(it,"cards"));
    opts={free:true, xpPer:XP.free, label:"Révision libre"};
  } else if(mode==="listen"){
    queue=shuffle(learnedPool()).slice(0,10).map(it=>ex(it,"listen"));
    opts={xpPer:XP.free, label:"Oreille"};
  } else {
    let pool=learnedPool().filter(puzzleOk); if(pool.length<3) pool=openItems().filter(puzzleOk);
    queue=shuffle(pool).slice(0,8).map(it=>ex(it,"puzzle"));
    opts={xpPer:XP.free, label:"Puzzle"};
  }
  session=Object.assign({mode,queue,i:0,good:0,xp:0,combo:0},opts);
  next();
}
function startLesson(nd){
  const replay=isDone(nd.id), its=nd.items;
  const drills=[...shuffle(its).slice(0,3).map(it=>ex(it,"listen")), ...shuffle(its.filter(puzzleOk)).slice(0,2).map(it=>ex(it,"puzzle"))];
  const queue=[...its.map(it=>ex(it,"cards")), ...shuffle(drills)];
  session={mode:"lesson",node:nd,queue,i:0,good:0,xp:0,combo:0,free:replay,xpPer:XP.lesson,label:nodeLabel(nd)};
  next();
}
function startPractice(nd){
  const its=nd.ch.nodes.filter(x=>x.type==="lesson"&&x.k<=nd.upto).flatMap(x=>x.items);
  const pool=its.length?its:openItems();
  const queue=shuffle([
    ...shuffle(pool).slice(0,4).map(it=>ex(it,"cards")),
    ...shuffle(pool).slice(0,3).map(it=>ex(it,"listen")),
    ...shuffle(pool.filter(puzzleOk)).slice(0,3).map(it=>ex(it,"puzzle"))]);
  session={mode:"practice",node:nd,queue,i:0,good:0,xp:0,combo:0,free:true,xpPer:XP.practice,label:nodeLabel(nd)};
  next();
}
function renderAllDone(){
  $app.innerHTML=topBar(0)+`<div class="card end"><p class="big">Tout est révisé 🎉</p>
    <p class="prompt">Aucune phrase à revoir pour l'instant. Tu peux avancer sur ton chemin ou t'entraîner librement.</p></div>
    <div class="row"><button class="btn" id="to-path">Retour à l'accueil</button><button class="btn alt" id="free">Révision libre</button></div>`;
  bindTop();
  document.getElementById("to-path").onclick=render;
  document.getElementById("free").onclick=()=>start("free");
}
function topBar(p){
  const s=session;
  return `<div class="top"><button class="back" id="back" aria-label="Retour">←</button><div class="bar"><i style="width:${p}%"></i></div>
    ${s&&s.xp!==undefined?`<span class="sess-xp" id="sess-xp">+${s.xp} XP</span>`:""}</div>`;
}
function bindTop(){ document.getElementById("back").onclick=()=>{ window.speechSynthesis&&speechSynthesis.cancel(); render(); }; }
function next(){
  const s=session;
  if(s.i>=s.queue.length) return finish();
  const e=s.queue[s.i], p=Math.round(s.i/s.queue.length*100);
  s.shownAt=Date.now();
  ({cards:showCard,listen:showListen,puzzle:showPuzzle})[e.kind](e.it,p);
}
function award(ok){
  touchStreak();
  const s=session, d=dayRec();
  d.n++; d.sec += Math.min(90,Math.max(1,(Date.now()-(s.shownAt||Date.now()))/1000));
  let gain=0;
  if(ok){
    d.good++; s.good++; s.combo=(s.combo||0)+1; gain=s.xpPer||10;
    if(s.combo%5===0){ gain+=XP.combo; toast(`🔥 Combo ×${s.combo} · +${XP.combo} XP bonus`); }
  } else { s.combo=0; gain=s.xpMiss||0; }
  if(gain){ S.xp=(S.xp||0)+gain; d.xp=(d.xp||0)+gain; s.xp=(s.xp||0)+gain; }
  const el=document.getElementById("sess-xp"); if(el) el.textContent=`+${s.xp} XP`;
  save();
}
function finish(){
  const s=session; let title="Muito bem!", sub="";
  if(s.node && !isDone(s.node.id)){
    markDone(s.node.id);
    S.xp+=XP.nodeBonus; dayRec().xp+=XP.nodeBonus; s.xp+=XP.nodeBonus; save();
    sub=`Bonus d'étape : +${XP.nodeBonus} XP`;
  }
  if(s.mode==="lesson") title="Leçon terminée !";
  if(s.mode==="practice") title="Révision terminée !";
  if(s.mode==="review") title="Révisions faites !";
  const ri=rankOf(S.xp), rk=RANKS[ri], nx=RANKS[ri+1];
  const pc = nx ? Math.round((S.xp-rk.xp)/(nx.xp-rk.xp)*100) : 100;
  const total=s.queue.length;
  $app.innerHTML = topBar(100)+`<div class="card end">
    <p class="big">${title}</p>
    <p class="xp-big">+${s.xp} XP</p>
    <p class="prompt">${s.good} / ${total} réussies${sub?` · ${sub}`:""}</p>
    <div class="fin-rank"><span>${rk.em} ${rk.name}</span><span class="pbar"><i style="width:${pc}%"></i></span>
      <small>${nx?`${(nx.xp-S.xp).toLocaleString("fr-FR")} XP avant ${nx.name}`:"Rang maximum"}</small></div></div>
    <div class="row">${s.node?`<button class="btn" id="home">Continuer</button>`:`<button class="btn alt" id="again">Encore une</button><button class="btn" id="home">Accueil</button>`}</div>`;
  bindTop();
  const ag=document.getElementById("again"); if(ag) ag.onclick=()=>start(s.mode);
  document.getElementById("home").onclick=render;
}
const audioBtns = t => `<div class="audio"><button data-say="${esc(t)}">🔊 Écouter</button><button data-say="${esc(t)}" data-slow="1">🐢 Lentement</button></div>`;
function bindAudio(){ $app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,!!b.dataset.slow)); }

/* Mode 1 : cartes à répétition espacée */
function showCard(it,p){
  const isNew=!S.cards[it.id];
  const free = session.free || (session.mode==="lesson" && !isNew);
  $app.innerHTML = topBar(p)+`<div class="card">
    <p class="prompt">${isNew?"Nouvelle phrase · essaie de deviner avant de retourner":free?"Entraînement · comment dirais-tu…":"Comment dirais-tu…"}</p>
    <p class="big">${esc(it.fr)}</p>
    <div id="back-side" class="hidden">
      <p class="big pt">${esc(txt(it))}</p>
      ${audioBtns(txt(it))}
      <p class="prompt" style="margin-top:10px">Répète-la à voix haute, deux fois.</p>
      ${it.note?`<p class="note">${esc(it.note)}</p>`:""}
    </div></div>
    <div class="row" id="reveal-row"><button class="btn" id="reveal">Voir la réponse</button></div>
    <div class="row hidden" id="grade-row">
      <button class="btn ko" data-g="0">À revoir</button>
      <button class="btn alt" data-g="1">Presque</button>
      <button class="btn ok" data-g="2">Facile</button>
    </div>`;
  bindTop();
  document.getElementById("reveal").onclick=()=>{
    document.getElementById("back-side").classList.remove("hidden");
    document.getElementById("reveal-row").classList.add("hidden");
    document.getElementById("grade-row").classList.remove("hidden");
    bindAudio(); speak(txt(it));
  };
  $app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g;
    if(free){ award(g>0); session.i++; return next(); }
    if(isNew){ dayRec().nw++; }
    const prev=S.cards[it.id]||{box:0,due:0};
    const c={box:prev.box||0,due:prev.due||0};
    c.box = g===0 ? 0 : g===1 ? Math.max(1,c.box) : Math.min(INTERVALS.length-1,c.box+1);
    c.due = today() + (g===0 ? 0 : INTERVALS[c.box]*DAY);
    S.cards[it.id]=c;
    if(g===0) session.queue.push(ex(it,"cards")); // on la revoit en fin de session
    award(g>0); session.i++; next();
  });
}

/* Mode 2 : écoute */
function showListen(it,p){
  let near=openItems().filter(x=>x.id!==it.id&&Math.abs(x.lvl-it.lvl)<=1); if(near.length<3) near=ITEMS.filter(x=>x.id!==it.id&&x.lvl===it.lvl);
  const opts=shuffle([it,...shuffle(near).slice(0,3)]);
  $app.innerHTML = topBar(p)+`<div class="card">
    <p class="prompt">Écoute, puis choisis ce que ça veut dire.</p>
    ${audioBtns(txt(it))}
    <p class="big pt hidden" id="reveal-pt">${esc(txt(it))}</p>
  </div><div class="choices">${opts.map(o=>`<button class="choice" data-id="${o.id}">${esc(o.fr)}</button>`).join("")}</div>
  <div class="row hidden" id="nx"><button class="btn" id="next">Continuer</button></div>`;
  bindTop(); bindAudio(); speak(txt(it));
  let done=false;
  $app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(done) return; done=true;
    const ok=b.dataset.id===it.id;
    b.classList.add(ok?"good":"bad");
    if(!ok) $app.querySelector(`.choice[data-id="${it.id}"]`).classList.add("good");
    document.getElementById("reveal-pt").classList.remove("hidden");
    document.getElementById("nx").classList.remove("hidden");
    award(ok);
    document.getElementById("next").onclick=()=>{ session.i++; next(); };
  });
}

/* Mode 3 : puzzle */
function showPuzzle(it,p){
  const target=txt(it), words=target.replace(/[!?.,]/g,"").split(" ");
  let pool=shuffle(words.map((w,i)=>({w,i}))), placed=[];
  $app.innerHTML = topBar(p)+`<div class="card">
    <p class="prompt">Traduis en remettant les mots dans l'ordre.</p>
    <p class="big">${esc(it.fr)}</p>
    <div class="slot" id="slot" aria-label="Ta phrase"></div>
    <p class="feedback hidden" id="fb"></p>
  </div><div class="pool" id="pool"></div>
  <div class="row"><button class="btn" id="check" disabled>Vérifier</button></div>`;
  bindTop();
  const draw=()=>{
    document.getElementById("slot").innerHTML=placed.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.w)}</button>`).join("");
    document.getElementById("pool").innerHTML=pool.map((t,k)=>`<button class="tile" data-p="${k}">${esc(t.w)}</button>`).join("");
    $app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ placed.push(pool.splice(+b.dataset.p,1)[0]); draw(); });
    $app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ pool.push(placed.splice(+b.dataset.k,1)[0]); draw(); });
    document.getElementById("check").disabled=pool.length>0;
  };
  draw();
  document.getElementById("check").onclick=function(){
    if(this.dataset.state==="done"){ session.i++; return next(); }
    const ok=clean(placed.map(t=>t.w).join(" "))===clean(target);
    const fb=document.getElementById("fb");
    fb.className="feedback "+(ok?"ok":"ko");
    fb.innerHTML= ok ? "Certo ! 👏" : `Presque. La bonne phrase : <span class="pt">${esc(target)}</span>`;
    speak(target); award(ok);
    this.textContent="Continuer"; this.dataset.state="done";
    $app.querySelectorAll(".tile").forEach(t=>t.disabled=true);
  };
}

const storyNode = st => allNodes().find(nd=>nd.type==="story"&&nd.story===st.id);
const storyOpen = st => { const nd=storyNode(st); return !!nd && nodeState(nd)!=="locked"; };
const storyState = id => (S.stories||{})[id];

function renderStories(){
  session=null;
  allNodes();
  const item = st => {
    const open=storyOpen(st), done=storyState(st.id), nd=storyNode(st);
    const right = !open ? "🔒" : done ? `✅ ${done.best}/${done.total}` : `<span class="due">Nouveau</span>`;
    const lock = st.bonus ? "Se débloque après la leçon juste avant, sur ton chemin" : `Fin du chapitre ${nd.ch.n}`;
    return `<button class="story-item ${open?"":"locked"}" ${open?`data-story="${st.id}"`:"disabled"}>
      <span class="ic">${st.emoji}</span>
      <span class="st-txt"><strong>${esc(st.title)}${st.bonus?` <span class="tag">bonus</span>`:""}</strong><small>${open?esc(st.fr):lock}</small></span>
      <span class="st-right">${right}</span></button>`;
  };
  const groups = SAGA.map(ch=>{
    const list = ch.nodes.filter(nd=>nd.type==="story").map(nd=>STORIES.find(st=>st.id===nd.story));
    const read = list.filter(st=>storyState(st.id)).length;
    return `<h2 class="st-group">${ch.emoji} Chapitre ${ch.n} · ${esc(ch.title)} <small>${read}/${list.length}</small></h2>
      <div class="modes">${list.map(item).join("")}</div>`;
  }).join("");
  $app.innerHTML = `<div class="top"><button class="back" id="back" aria-label="Retour">←</button><strong>Histoires en famille</strong></div>
    <p class="lead">De petites scènes de la vie de famille. Écoute, touche une bulle pour voir la traduction, et réponds quand c'est ton tour. Les histoires bonus sont facultatives : elles ne bloquent jamais ton chemin.</p>
    ${groups}`;
  document.getElementById("back").onclick=render;
  $app.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>playStory(b.dataset.story));
  window.scrollTo(0,0);
}

function playStory(id,nd){
  const st=STORIES.find(x=>x.id===id);
  session={mode:"story",story:st,node:nd||storyNode(st),i:0,good:0,asked:0,xp:0,combo:0,xpPer:XP.story,shownAt:Date.now()};
  $app.innerHTML = `<div class="top"><button class="back" id="back" aria-label="Retour">←</button><div class="bar"><i id="st-bar" style="width:0%"></i></div></div>
    <h2 class="st-title">${st.emoji} ${esc(st.title)}</h2>
    <div class="chat" id="chat"></div>
    <div class="st-act" id="act"></div>`;
  document.getElementById("back").onclick=()=>{ window.speechSynthesis&&speechSynthesis.cancel(); renderStories(); };
  storyStep();
}
function bubble(who,pt,fr,note){
  const c=CAST[who]||CAST.tu, me=who==="tu";
  const el=document.createElement("div");
  el.className="bub-row"+(me?" me":"");
  el.innerHTML=`${me?"":`<span class="av" aria-hidden="true">${c.av}</span>`}
    <button class="bub ${me?"me":""}" aria-label="${esc(c.name)} : ${esc(pt)}. Toucher pour la traduction">
      ${me?"":`<span class="who">${esc(c.name)}</span>`}
      <span class="bpt">${esc(pt)}</span>
      <span class="tr hidden">${esc(fr)}</span></button>`;
  const b=el.querySelector(".bub");
  b.onclick=()=>{ el.querySelector(".tr").classList.toggle("hidden"); speak(pt,false,c.pitch); };
  document.getElementById("chat").appendChild(el);
  if(note){ const n=document.createElement("p"); n.className="note"; n.textContent="💡 "+note; document.getElementById("chat").appendChild(n); }
  speak(pt,false,c.pitch);
  el.scrollIntoView({behavior:"smooth",block:"end"});
}
function storyStep(){
  const s=session, st=s.story, act=document.getElementById("act");
  document.getElementById("st-bar").style.width=Math.round(s.i/st.steps.length*100)+"%";
  if(s.i>=st.steps.length) return storyEnd();
  const step=st.steps[s.i];
  const goOn=()=>{ s.i++; storyStep(); };
  if(!step.t){
    bubble(step.s,step.pt,step.fr,step.note);
    act.innerHTML=`<button class="btn" id="st-next">Continuer</button>`;
    document.getElementById("st-next").onclick=goOn;
    return;
  }
  s.shownAt=Date.now(); s.asked++;
  const order=shuffle(step.opts.map((o,k)=>k));
  const ask = step.t==="fill" ? "Complète la phrase" : step.ask;
  let preview="";
  if(step.t==="fill"){
    const c=CAST[step.s]||CAST.tu;
    preview=`<p class="fill-line"><span class="who">${esc(c.name)}</span>${esc(step.pt).replace("___",'<span class="gap">____</span>')}</p>`;
  }
  act.innerHTML=`<div class="st-q"><p class="prompt">${esc(ask)}</p>${preview}
    <div class="choices">${order.map(k=>`<button class="choice" data-k="${k}">${esc(step.opts[k])}</button>`).join("")}</div></div>`;
  act.scrollIntoView({behavior:"smooth",block:"end"});
  let answered=false;
  act.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(answered) return; answered=true;
    const k=+b.dataset.k, ok=k===step.ok;
    b.classList.add(ok?"good":"bad");
    if(!ok) act.querySelector(`.choice[data-k="${step.ok}"]`).classList.add("good");
    act.querySelectorAll(".choice").forEach(x=>x.disabled=true);
    award(ok);
    const msg = ok ? ["Certo! 👏","Muito bem!","Isso mesmo!"][Math.floor(Math.random()*3)] : "Quase… la bonne réponse est en vert.";
    const fb=document.createElement("p"); fb.className="feedback "+(ok?"ok":"ko"); fb.textContent=msg;
    act.querySelector(".st-q").appendChild(fb);
    const nx=document.createElement("button"); nx.className="btn"; nx.textContent="Continuer"; nx.style.marginTop="12px";
    nx.onclick=()=>{
      if(step.t==="reply") bubble("tu",step.opts[step.ok],step.fr,step.note);
      if(step.t==="fill") bubble(step.s,step.pt.replace("___",step.opts[step.ok]),step.fr,step.note);
      goOn();
    };
    act.appendChild(nx);
    if(step.t==="quiz"){} // pas de bulle pour les questions de compréhension
  });
}
function storyEnd(){
  const s=session, st=s.story;
  if(!S.stories || Object.isFrozen(S.stories)) S.stories=Object.assign({},S.stories||{});
  const prev=S.stories[st.id];
  const first=!prev;
  S.stories[st.id]={done:true,best:Math.max(prev?prev.best:0,s.good),total:s.asked};
  if(first){ S.xp+=20; dayRec().xp+=20; s.xp+=20; }
  const nd=s.node, ns=nd?nodeState(nd):"locked", onPath = nd && !isDone(nd.id) && (ns==="current"||ns==="open");
  if(onPath) markDone(nd.id);
  save();
  document.getElementById("act").innerHTML=`<div class="card end" style="min-height:0">
    <p class="big">História terminada! 🎉</p>
    <p class="xp-big">+${s.xp} XP</p>
    <p class="prompt">${s.good} / ${s.asked} bonnes réponses${first?" · dont +20 XP pour ta première lecture":""}</p></div>
    <div class="row"><button class="btn alt" id="st-again">Relire</button>
    <button class="btn" id="st-path">${onPath&&!nd.bonus?"Ouvrir le coffre du chapitre 🎁":"Continuer"}</button></div>`;
  document.getElementById("st-bar").style.width="100%";
  document.getElementById("st-again").onclick=()=>playStory(st.id,nd);
  document.getElementById("st-path").onclick=()=>{
    const c=currentNode();
    if(onPath && !nd.bonus && c && c.type==="chest") return openChest(c);
    render();
  };
  const a=document.getElementById("act"); if(a.scrollIntoView) a.scrollIntoView({behavior:"smooth",block:"end"});
}

/* ---------- Démarrage ---------- */
document.getElementById("home-btn").onclick=()=>render();
document.getElementById("stats-btn").onclick=()=>{ window.speechSynthesis&&speechSynthesis.cancel(); renderStats(); };
function render(){ session=null; migratePath(); renderHome(); }

loadLocal();
S.variant="pt";
render();
setTimeout(()=>{ loadVoices(); if(!session) render(); },600);
initRemote();
</script>
